<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://dcsybbntekheaftahhtr.supabase.co/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjc3liYm50ZWtoZWFmdGFoaHRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTAxMzgsImV4cCI6MjA5NTY2NjEzOH0.DUkpbxhTr0JwRn0hNK2L-_nT1JXOjPkesUDvZvKxItE";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadChapters() {
        // جلب الفصول مرتبة تنازلياً حسب رقم الفصل
        const { data, error } = await supabase
            .from('chapters')
            .select('*')
            .order('number', { ascending: false });

        const listDiv = document.getElementById('chapters-list');
        listDiv.innerHTML = "";

        if (data) {
            data.forEach((chapter) => {
                const card = document.createElement('a');
                card.href = `reader.html?ch=${chapter.number}`;
                card.className = "chapter-card";
                card.innerText = `الفصل ${chapter.number}: ${chapter.title}`;
                listDiv.appendChild(card);
            });
        }
    }
    loadChapters();
</script>
